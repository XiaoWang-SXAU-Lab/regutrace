[package]
name = "regutrace-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Core library for ReguTrace: local TF-target evidence construction"
repository = "https://github.com/XiaoWang-SXAU-Lab/regutrace"
readme = "../../README.md"

[dependencies]
anyhow = "1.0.104"
csv = "1.4.0"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
