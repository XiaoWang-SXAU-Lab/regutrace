[package]
name = "regutrace-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ReguTrace CLI: local TF-target evidence construction and SQLite store"
repository = "https://github.com/XiaoWang-SXAU-Lab/regutrace"
readme = "../../README.md"

[dependencies]
anyhow = "1.0.104"
csv = "1.4.0"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
regutrace-core = { path = "../regutrace-core" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.154"
rayon = "1.11"

[dev-dependencies]
serde_json = "1.0.154"

[[bin]]
name = "regutrace"
path = "src/main.rs"
